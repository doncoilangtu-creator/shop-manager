name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Dummy values: build/test never talk to a real Supabase project.
      NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
      SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
      INITIAL_ADMIN_PASSWORD: dummy-password-for-ci
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Audit (production deps)
        run: npm audit --omit=dev
      - name: .env.example in sync with code
        run: node scripts/check-env-example.mjs . .env.example

  bot:
    name: Bot (Telegram, grammY)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bot/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Audit (production deps)
        run: npm audit --omit=dev


  db:
    name: DB tests (local Postgres, not Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # NOTE: first written without access to GitHub Actions (verified locally on PostgreSQL 17 only). Non-blocking until it has
    # been green on this runner image once; then remove continue-on-error.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL server binaries
        run: sudo apt-get update && sudo apt-get install -y postgresql postgresql-contrib
      - name: Build local DB (compat layer + all migrations)
        run: bash scripts/local-db.sh up
      - name: Run DB tests (fail on any CONFIRMED weakness or failed control)
        run: bash tests/db/run.sh --strict
      - name: End-to-end accounting scenario
        run: bash scripts/e2e-scenario.sh

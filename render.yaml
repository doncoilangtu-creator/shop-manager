# Render blueprint for the Telegram bot (the web app is deployed on Vercel). Secrets are set in the dashboard (sync: false).
services:
  - type: web
    name: shop-manager-bot
    runtime: docker
    dockerfilePath: ./bot/Dockerfile
    dockerContext: ./bot
    healthCheckPath: /healthz
    envVars:
      - { key: BOT_MODE, value: webhook }
      - { key: TELEGRAM_BOT_TOKEN, sync: false }
      - { key: SUPABASE_URL, sync: false }
      - { key: SUPABASE_SERVICE_ROLE_KEY, sync: false }
      - { key: APP_URL, sync: false }
      - { key: WEBHOOK_URL, sync: false }          # https://<service>.onrender.com
      - { key: WEBHOOK_SECRET, generateValue: true }
